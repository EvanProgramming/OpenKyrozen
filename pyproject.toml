[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openkyrozen"
version = "2.0.4"
description = "Self-learning AI Agent — DeepSeek · OpenAI · Claude · Gemini · Ollama"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12,<3.14"
authors = [
    {name = "Evan", email = "evan@openkyrozen.dev"}
]
keywords = ["ai", "agent", "llm", "self-learning", "deepseek", "chatbot", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "chromadb>=0.4.0",
    "cryptography>=42.0.0",
    "graphifyy==0.9.64",
    "googlesearch-python>=1.2.3",
    "openai>=1.0.0",
    "PyYAML>=6.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
web = ["fastapi", "uvicorn"]
claude = ["anthropic>=0.30.0"]
gemini = ["google-generativeai>=0.8.0"]
browser = ["playwright>=1.40"]
all = ["fastapi", "uvicorn", "anthropic>=0.30.0", "google-generativeai>=0.8.0", "playwright>=1.40"]

[project.scripts]
kyrozen = "tui_launcher:main"
kyrozen-backend = "tui_backend:main"
kyrozen-web = "server:main_entry"
kyrozen-bootstrap-gh = "github_cli:main"

[project.urls]
Homepage = "https://github.com/EvanProgramming/OpenKyrozen"
Repository = "https://github.com/EvanProgramming/OpenKyrozen"
Issues = "https://github.com/EvanProgramming/OpenKyrozen/issues"

[tool.setuptools]
py-modules = ["main", "tui_launcher", "tui_backend", "memory", "providers", "server", "tools", "event_store", "interaction", "learning_engine", "learning_benchmark", "learning_worker", "migration", "task_engine", "scheduler", "skill_registry", "browser_manager", "instruction_loader", "agent_config", "subagents", "capability_tokens", "tool_registry", "dynamic_tools", "plugin_runtime", "workspace_context", "project_graph", "github_cli"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["plugins*", "prompts*", "builtin_skills*"]

[tool.setuptools.package-data]
plugins = ["*.py"]
prompts = ["*.md"]
builtin_skills = ["manifest.json", "NOTICE.md", "*/SKILL.md", "*/skill.json", "*/LICENSE*", "*/NOTICE"]

[tool.setuptools.data-files]
"share/openkyrozen" = ["agent.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
