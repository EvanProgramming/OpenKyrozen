[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openkyrozen"
version = "2.0.6"
description = "Self-learning AI Agent with broad LLM provider support"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12,<3.14"
authors = [
    {name = "Evan", email = "evan@openkyrozen.dev"}
]
keywords = ["ai", "agent", "llm", "self-learning", "deepseek", "chatbot", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "chromadb>=0.4.0",
    "cryptography>=42.0.0",
    "graphifyy==0.9.64",
    "googlesearch-python>=1.2.3",
    "openai>=1.0.0",
    "PyYAML>=6.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "send2trash>=1.8.3",
]

[project.optional-dependencies]
web = ["fastapi", "uvicorn"]
claude = ["anthropic>=0.30.0"]
gemini = ["google-genai>=1.0.0"]
perplexity = ["perplexityai>=0.1.0"]
bedrock = ["boto3>=1.35.0"]
vertex = ["google-genai>=1.0.0"]
azure = ["azure-identity>=1.17.0"]
cloud = ["perplexityai>=0.1.0", "boto3>=1.35.0", "google-genai>=1.0.0", "azure-identity>=1.17.0"]
browser = ["playwright>=1.40"]
all = [
    "fastapi", "uvicorn", "anthropic>=0.30.0", "google-genai>=1.0.0",
    "perplexityai>=0.1.0", "boto3>=1.35.0", "azure-identity>=1.17.0",
    "playwright>=1.40",
]

[project.scripts]
kyrozen = "openkyrozen.interfaces.cli.launcher:main"
kyrozen-backend = "openkyrozen.interfaces.tui.backend:main"
kyrozen-web = "openkyrozen.interfaces.web.app:main_entry"
kyrozen-bootstrap-gh = "openkyrozen.tools.github_cli:main"

[project.urls]
Homepage = "https://github.com/EvanProgramming/OpenKyrozen"
Repository = "https://github.com/EvanProgramming/OpenKyrozen"
Issues = "https://github.com/EvanProgramming/OpenKyrozen/issues"

[tool.setuptools]
py-modules = ["main", "server", "tui_launcher", "tui_backend", "learning_worker", "github_cli", "main_debug", "migration", "learning_benchmark"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["openkyrozen*", "plugins*", "prompts*", "builtin_skills*"]

[tool.setuptools.package-data]
"openkyrozen.interfaces.web" = ["templates/*.html"]
plugins = ["*.py"]
prompts = ["*.md"]
builtin_skills = ["manifest.json", "NOTICE.md", "*/SKILL.md", "*/skill.json", "*/LICENSE*", "*/NOTICE"]

[tool.setuptools.data-files]
"share/openkyrozen" = ["agent.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
