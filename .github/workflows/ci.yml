name: V3 Windows reliability diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
        revision: ['0f172f9fe692ff8fafcc0a15a72fe51eaf67e977', 'c98800198a92944b3166a1e43cceef7bf55a4d95']
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ matrix.revision }}'
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - name: Install project dependencies
        run: python -m pip install -e '.[all]'
      - name: Repeat cancellation and reviewer acceptance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          $failed = 0
          1..20 | ForEach-Object {
            $iteration = $_
            python -m unittest -v tests.test_delegation.DelegationTests.test_cancel_during_provider_call_prevents_late_write *> "diagnostics/cancel-$iteration.log"
            if ($LASTEXITCODE -ne 0) { $failed++ ; Write-Host "Cancellation iteration $iteration failed" }
            python scripts/subagent_workflow_acceptance.py *> "diagnostics/reviewer-$iteration.log"
            if ($LASTEXITCODE -ne 0) { $failed++ ; Write-Host "Reviewer iteration $iteration failed" }
          }
          Write-Host "Diagnostic failures: $failed"
          if ($failed -gt 0) { exit 1 }
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-reliability-py${{ matrix.python }}-${{ matrix.revision }}
          path: diagnostics/
          if-no-files-found: warn
