name: V3 Windows extended reliability
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repeat:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 24005ebf33a78d6bd23381dca0d0d2c25a598e91
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e '.[all]'
      - name: Test database protection
        run: python -m unittest tests.test_history -v
      - name: Repeat cancellation and reviewer acceptance
        shell: pwsh
        run: |
          @'
          import faulthandler, runpy, sys
          faulthandler.dump_traceback_later(8, repeat=False)
          if sys.argv[1] == 'cancel':
              sys.argv = ['unittest', 'tests.test_delegation.DelegationTests.test_cancel_during_provider_call_prevents_late_write', '-v']
              runpy.run_module('unittest', run_name='__main__')
          else:
              sys.argv = ['scripts/subagent_workflow_acceptance.py']
              runpy.run_path(sys.argv[0], run_name='__main__')
          '@ | Set-Content -Encoding utf8 reliability.py
          New-Item -ItemType Directory -Force logs | Out-Null
          foreach ($mode in @('cancel','reviewer')) {
            for ($i=1; $i -le $(if ($mode -eq 'cancel') {50} else {30}); $i++) {
              python reliability.py $mode *> "logs/$mode-$i.log"
              Write-Host "$mode iteration $i exit=$LASTEXITCODE"
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extended-candidate-reliability-${{ matrix.python }}
          path: logs/
          if-no-files-found: warn
