name: V3 historical cancellation tracing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0f172f9fe692ff8fafcc0a15a72fe51eaf67e977
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[all]'
      - name: Repeat historical cancellation with thread dumps
        shell: pwsh
        run: |
          @'
          import faulthandler, runpy, sys
          faulthandler.dump_traceback_later(4, repeat=True)
          sys.argv = ['unittest', 'tests.test_delegation.DelegationTests.test_cancel_during_provider_call_prevents_late_write', '-v']
          runpy.run_module('unittest', run_name='__main__')
          '@ | Set-Content -Encoding utf8 trace_cancel.py
          New-Item -ItemType Directory -Force logs | Out-Null
          for ($i=1; $i -le 100; $i++) {
            python trace_cancel.py *> "logs/cancel-$i.log"
            Write-Host "iteration $i exit=$LASTEXITCODE"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-cancellation-traces
          path: logs/
          if-no-files-found: warn
