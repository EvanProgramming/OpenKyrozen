name: V3 Windows reliability diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12']
        revision: ['caa7f444c5d5be43bb53f40625879c3fe19bf167']
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ matrix.revision }}'
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - name: Install project dependencies
        run: python -m pip install -e '.[all]'
      - name: Repeat cancellation and reviewer acceptance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          @'
          import runpy, sqlite3, sys, threading, traceback
          seen = set()
          def trace(frame, event, arg):
              if event == "exception" and isinstance(arg[1], sqlite3.OperationalError):
                  key = id(arg[1])
                  if key not in seen:
                      seen.add(key)
                      print("TRACE_SQLITE_ERROR", repr(arg[1]), file=sys.stderr, flush=True)
                      traceback.print_stack(frame, limit=30, file=sys.stderr)
              return trace
          sys.settrace(trace)
          threading.settrace(trace)
          runpy.run_path("scripts/subagent_workflow_acceptance.py", run_name="__main__")
          '@ | Set-Content -Encoding utf8 diagnostics/trace_acceptance.py
          $failed = 0
          1..20 | ForEach-Object {
            $iteration = $_
            python -m unittest -v tests.test_delegation.DelegationTests.test_cancel_during_provider_call_prevents_late_write *> "diagnostics/cancel-$iteration.log"
            if ($LASTEXITCODE -ne 0) { $failed++ ; Write-Host "Cancellation iteration $iteration failed" }
            python diagnostics/trace_acceptance.py *> "diagnostics/reviewer-$iteration.log"
            if ($LASTEXITCODE -ne 0) { $failed++ ; Write-Host "Reviewer iteration $iteration failed" }
          }
          Write-Host "Diagnostic failures: $failed"
          if ($failed -gt 0) { exit 1 }
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-reliability-py${{ matrix.python }}-${{ matrix.revision }}
          path: diagnostics/
          if-no-files-found: warn
