name: OpenKyrozen CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      v3_release_candidate_sha:
        description: Full candidate SHA for the six-platform V3 release gate
        required: false
        type: string
  schedule:
    # Monday 04:17 Asia/Shanghai.
    - cron: "17 20 * * 0"

permissions:
  contents: read

concurrency:
  group: openkyrozen-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.classify.outputs.python }}
      tui: ${{ steps.classify.outputs.tui }}
      wheel: ${{ steps.classify.outputs.wheel }}
      docker: ${{ steps.classify.outputs.docker }}
      updates: ${{ steps.classify.outputs.updates }}
      docs: ${{ steps.classify.outputs.docs }}
      all: ${{ steps.classify.outputs.all }}
      core: ${{ steps.classify.outputs.core }}
      full: ${{ steps.classify.outputs.full }}
      release: ${{ steps.classify.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FULL_RUN: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          RELEASE_CANDIDATE_SHA: ${{ inputs.v3_release_candidate_sha }}
        run: |
          args=(--event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA")
          if [[ "$FULL_RUN" == true ]]; then args+=(--full); fi
          if [[ -n "$RELEASE_CANDIDATE_SHA" ]]; then args+=(--release-candidate-sha "$RELEASE_CANDIDATE_SHA"); fi
          python scripts/ci_changes.py "${args[@]}"

  core-test:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    env:
      KYROZEN_SANDBOX_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install the core development environment
        run: make install-core PYTHON=python
      - name: Install the required Linux filesystem sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run non-browser tests
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.all == 'true'
        run: make test-core PYTHON=python
      - name: Validate documentation and inventories
        if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.all == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y zsh bubblewrap
          make docs-check PYTHON=python

  python-test:
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    env:
      KYROZEN_SANDBOX_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install full development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y zsh bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python -m pip install --upgrade pip
          pip install -e '.[all]'
      - name: Install Chromium and run the full test suite
        run: |
          python -m playwright install --with-deps chromium
          make test PYTHON=python
      - name: Agent workflow acceptance
        run: make agent-acceptance PYTHON=python
      - name: Syntax and shell checks
        run: |
          python -m compileall -q openkyrozen main.py server.py tui_launcher.py tui_backend.py main_debug.py learning_worker.py github_cli.py learning_benchmark.py migration.py scripts tests benchmarks
          sh -n install.sh
      - name: Tool inventory check
        run: |
          python -c "from openkyrozen.tools import ToolAdapters; available = ToolAdapters().AVAILABLE_TOOLS; assert len(available) >= 24, f'Expected >=24 tools, got {len(available)}'; print(f'{len(available)} tools OK')"
      - name: Provider import check
        run: python -c "from openkyrozen.providers import *; print('All providers imported OK')"
      - name: Documentation and runtime inventory check
        run: make docs-check PYTHON=python

  full-python-312:
    needs: changes
    if: needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    env:
      KYROZEN_SANDBOX_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install all development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y zsh bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python -m pip install --upgrade pip
          pip install -e '.[all]'
      - name: Install Chromium and run the full test suite
        run: |
          python -m playwright install --with-deps chromium
          make test PYTHON=python
          python -m compileall -q openkyrozen main.py server.py tui_launcher.py tui_backend.py main_debug.py learning_worker.py github_cli.py learning_benchmark.py migration.py scripts tests benchmarks
          sh -n install.sh

  tui-test:
    needs: changes
    if: needs.changes.outputs.tui == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: tui/go.sum
      - name: Test the Bubble Tea terminal UI
        run: go test ./...
        working-directory: tui

  wheel-install:
    needs: changes
    if: needs.changes.outputs.wheel == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: tui/go.sum
      - name: Build and run clean wheel installation smoke test
        run: |
          python -m pip install --upgrade pip build
          python scripts/wheel_smoke.py
          pip install -e '.[all]'
      - name: Rebuilt TUI interaction acceptance
        run: make tui-acceptance PYTHON=python

  installer-syntax:
    needs: changes
    if: needs.changes.outputs.updates == 'true' || needs.changes.outputs.all == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse installer and run help path (Windows PowerShell 5.1)
        shell: powershell
        run: ./install.ps1 -Help
      - name: Parse installer and run help path (PowerShell 7)
        shell: pwsh
        run: ./install.ps1 -Help

  docker-persistence:
    needs: changes
    if: needs.changes.outputs.docker == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and replace-container persistence smoke test
        run: make docker-smoke

  update-install:
    needs: changes
    if: needs.changes.outputs.updates == 'true' || needs.changes.outputs.all == 'true'
    name: Installed update (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: tui/go.sum
      - name: Install uv
        run: python -m pip install uv
      - name: Install Linux browser system dependencies
        if: runner.os == 'Linux'
        run: |
          python -m pip install playwright
          python -m playwright install-deps chromium
      - name: Upgrade a real prior installation and verify matching components
        env:
          AUDIT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python scripts/update_workflow_acceptance.py
          --revision ${{ env.AUDIT_REVISION }}
          --baseline git+https://github.com/EvanProgramming/OpenKyrozen.git@94a1d99eab337719308cbf998b0515f454c1acc6
          --output update-acceptance.json
      - name: Upload update acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-acceptance-${{ matrix.os }}
          path: update-acceptance.json

  v3-platform-validation:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    name: V3 production matrix (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-py312, os: ubuntu-latest, python: '3.12' }
          - { platform: linux-py313, os: ubuntu-latest, python: '3.13' }
          - { platform: macos-py312, os: macos-latest, python: '3.12' }
          - { platform: macos-py313, os: macos-latest, python: '3.13' }
          - { platform: windows-py312, os: windows-latest, python: '3.12' }
          - { platform: windows-py313, os: windows-latest, python: '3.13' }
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.v3_release_candidate_sha || github.sha }}
      PLATFORM_ID: ${{ matrix.platform }}
      KYROZEN_BROWSER_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.v3_release_candidate_sha || github.sha }}
      - name: Verify exact candidate
        shell: bash
        run: |
          [[ "$CANDIDATE_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: tui/go.sum
      - name: Install Linux sandbox and browser system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python -m pip install playwright
          python -m playwright install-deps chromium
      - name: Install project and browser dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[all]'
          python -m playwright install chromium
      - name: Require the Linux filesystem sandbox
        if: runner.os == 'Linux'
        shell: bash
        run: echo 'KYROZEN_SANDBOX_REQUIRED=1' >> "$GITHUB_ENV"
      - name: Run complete unit suite
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee unit.log
      - name: Run integration suite
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tests python -m unittest tests.test_durable_tasks_gateway tests.test_gateway_startup_logging -v 2>&1 | tee integration.log
      - name: Run supported-feature workflow and TUI acceptance
        env:
          PYTHONIOENCODING: utf-8
        shell: bash
        run: |
          set -euo pipefail
          python scripts/agent_workflow_acceptance.py 2>&1 | tee agent-acceptance.log
          python scripts/subagent_workflow_acceptance.py 2>&1 | tee subagent-acceptance.log
          binary="../kyrozen-tui"
          if [[ "$RUNNER_OS" == Windows ]]; then binary="../kyrozen-tui.exe"; fi
          (cd tui && go test ./... && go build -o "$binary" .) 2>&1 | tee tui-tests.log
          python scripts/tui_workflow_acceptance.py "${binary#../}" 2>&1 | tee tui-acceptance.log
      - name: Run 30-minute production soak
        shell: bash
        run: |
          set -euo pipefail
          python scripts/production_soak.py --seconds 1800 \
            --output soak.json --log-dir soak-logs 2>&1 | tee soak.log
      - name: Record platform result
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import importlib.metadata
          import json
          import os
          import platform
          from pathlib import Path
          soak = json.loads(Path("soak.json").read_text(encoding="utf-8"))
          dependencies = {
              distribution.metadata["Name"]: distribution.version
              for distribution in importlib.metadata.distributions()
              if distribution.metadata.get("Name")
          }
          result = {
              "schema_version": 1,
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "platform": os.environ["PLATFORM_ID"],
              "unit": "not_run" if os.environ["RUNNER_OS"] == "Windows" else "passed",
              "integration": "not_run" if os.environ["RUNNER_OS"] == "Windows" else "passed",
              "acceptance": "passed",
              "soak_seconds": int(soak["elapsed_seconds"]),
              "environment": {
                  "runner": os.environ["ImageOS"] if "ImageOS" in os.environ else os.environ["RUNNER_OS"],
                  "os": platform.platform(),
                  "python": platform.python_version(),
              },
              "dependencies": dependencies,
              "evidence_paths": ([
                  "agent-acceptance.log", "subagent-acceptance.log", "tui-tests.log",
                  "tui-acceptance.log", "soak.log", "soak.json",
              ] if os.environ["RUNNER_OS"] == "Windows" else [
                  "unit.log", "integration.log", "agent-acceptance.log",
                  "subagent-acceptance.log", "tui-tests.log", "tui-acceptance.log",
                  "soak.log", "soak.json",
              ]),
          }
          if os.environ["RUNNER_OS"] == "Windows":
              result["supported_features"] = "passed"
          Path("platform.json").write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload platform logs and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-platform-${{ matrix.platform }}
          path: |
            platform.json
            unit.log
            integration.log
            agent-acceptance.log
            subagent-acceptance.log
            tui-acceptance.log
            tui-tests.log
            soak.log
            soak.json
            soak-logs/
          if-no-files-found: warn
          retention-days: 30

  collect-r266:
    needs: [changes, v3-platform-validation]
    if: needs.changes.outputs.release == 'true' && needs.v3-platform-validation.result == 'success'
    runs-on: ubuntu-latest
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.v3_release_candidate_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.v3_release_candidate_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: v3-platform-*
          path: platform-results
          merge-multiple: false
      - name: Collect unsigned exact-candidate R266 record
        run: >-
          python scripts/v3_release_platforms.py
          --results-dir platform-results
          --output-dir v3-r266-evidence
          --candidate-sha "$CANDIDATE_SHA"
          --command-set .github/workflows/ci.yml
      - name: Upload unsigned R266 evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: v3-r266-${{ github.event.pull_request.head.sha || inputs.v3_release_candidate_sha || github.sha }}
          path: v3-r266-evidence/
          if-no-files-found: error
          retention-days: 30

  ci-result:
    name: CI result
    if: always()
    needs:
      - changes
      - core-test
      - python-test
      - full-python-312
      - tui-test
      - wheel-install
      - installer-syntax
      - docker-persistence
      - update-install
      - v3-platform-validation
      - collect-r266
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CORE_EXPECTED: ${{ needs.changes.outputs.core }}
          CORE_RESULT: ${{ needs.core-test.result }}
          PYTHON_EXPECTED: ${{ needs.changes.outputs.python }}
          ALL_EXPECTED: ${{ needs.changes.outputs.all }}
          PYTHON_RESULT: ${{ needs.python-test.result }}
          PYTHON_312_RESULT: ${{ needs.full-python-312.result }}
          TUI_EXPECTED: ${{ needs.changes.outputs.tui }}
          TUI_RESULT: ${{ needs.tui-test.result }}
          WHEEL_EXPECTED: ${{ needs.changes.outputs.wheel }}
          WHEEL_RESULT: ${{ needs.wheel-install.result }}
          UPDATE_EXPECTED: ${{ needs.changes.outputs.updates }}
          INSTALLER_RESULT: ${{ needs.installer-syntax.result }}
          UPDATE_RESULT: ${{ needs.update-install.result }}
          DOCKER_EXPECTED: ${{ needs.changes.outputs.docker }}
          DOCKER_RESULT: ${{ needs.docker-persistence.result }}
          RELEASE_EXPECTED: ${{ needs.changes.outputs.release }}
          RELEASE_MATRIX_RESULT: ${{ needs.v3-platform-validation.result }}
          RELEASE_COLLECT_RESULT: ${{ needs.collect-r266.result }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          require_selected() {
            local name="$1" expected="$2" result="$3"
            if [ "$expected" = true ] && [ "$result" != success ]; then
              echo "$name was selected but finished as $result" >&2
              exit 1
            fi
          }
          require_unselected() {
            local name="$1" result="$2"
            if [ "$result" != skipped ] && [ "$result" != success ]; then
              echo "$name was not selected but finished as $result" >&2
              exit 1
            fi
          }
          require_selected "Core tests" "$CORE_EXPECTED" "$CORE_RESULT"
          require_selected "Python tests" "$PYTHON_EXPECTED" "$PYTHON_RESULT"
          require_selected "Full Python 3.12 tests" "$ALL_EXPECTED" "$PYTHON_312_RESULT"
          require_selected "TUI tests" "$TUI_EXPECTED" "$TUI_RESULT"
          require_selected "Wheel smoke" "$WHEEL_EXPECTED" "$WHEEL_RESULT"
          require_selected "Installer syntax" "$UPDATE_EXPECTED" "$INSTALLER_RESULT"
          require_selected "Installed update" "$UPDATE_EXPECTED" "$UPDATE_RESULT"
          require_selected "Docker persistence" "$DOCKER_EXPECTED" "$DOCKER_RESULT"
          require_selected "V3 release matrix" "$RELEASE_EXPECTED" "$RELEASE_MATRIX_RESULT"
          require_selected "V3 R266 evidence collection" "$RELEASE_EXPECTED" "$RELEASE_COLLECT_RESULT"
          if [ "$CORE_EXPECTED" != true ]; then require_unselected "Unselected core job" "$CORE_RESULT"; fi
          if [ "$PYTHON_EXPECTED" != true ]; then require_unselected "Unselected Python tests" "$PYTHON_RESULT"; fi
          if [ "$ALL_EXPECTED" != true ]; then require_unselected "Unselected full Python 3.12 tests" "$PYTHON_312_RESULT"; fi
          require_unselected "Unselected TUI tests" "$TUI_RESULT"
          require_unselected "Unselected wheel smoke" "$WHEEL_RESULT"
          require_unselected "Unselected installer syntax" "$INSTALLER_RESULT"
          require_unselected "Unselected installed update" "$UPDATE_RESULT"
          require_unselected "Unselected Docker persistence" "$DOCKER_RESULT"
          if [ "$RELEASE_EXPECTED" != true ]; then require_unselected "Unselected V3 release matrix" "$RELEASE_MATRIX_RESULT"; fi
          if [ "$RELEASE_EXPECTED" != true ]; then require_unselected "Unselected V3 R266 collection" "$RELEASE_COLLECT_RESULT"; fi
