name: V3 SQLite Windows reduction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reduce:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise concurrent SQLite WAL connections
        shell: pwsh
        run: |
          @'
          import concurrent.futures, json, os, sqlite3, tempfile, threading
          from pathlib import Path
          print('SQLite version:', sqlite3.sqlite_version, flush=True)
          all_results = {}
          for keep_open in (False, True):
              failures = []
              for repetition in range(10):
                  with tempfile.TemporaryDirectory() as directory:
                      path = str(Path(directory) / 'state.sqlite3')
                      initial = sqlite3.connect(path, isolation_level=None, timeout=30)
                      initial.execute('PRAGMA journal_mode=WAL')
                      initial.execute('CREATE TABLE records (id INTEGER PRIMARY KEY, value TEXT)')
                      keeper = initial if keep_open else None
                      if not keep_open: initial.close()
                      barrier = threading.Barrier(8)
                      def worker(number):
                          barrier.wait()
                          for i in range(150):
                              db = sqlite3.connect(path, isolation_level=None, timeout=30)
                              try:
                                  db.execute('PRAGMA busy_timeout=30000')
                                  db.execute('PRAGMA synchronous=NORMAL')
                                  db.execute('INSERT INTO records(value) VALUES(?)', (str(number),))
                              except sqlite3.Error as exc:
                                  failures.append({'iteration': repetition, 'worker': number, 'step': i,
                                      'error': str(exc), 'code': getattr(exc,'sqlite_errorcode',None),
                                      'name': getattr(exc,'sqlite_errorname',None)})
                              finally: db.close()
                      with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
                          list(pool.map(worker, range(8)))
                      if keeper: keeper.close()
              all_results[str(keep_open)] = failures
              print('keeper', keep_open, 'failures', len(failures), flush=True)
          Path('sqlite-reduction.json').write_text(json.dumps({'sqlite_version':sqlite3.sqlite_version,'failures':all_results}, indent=2))
          '@ | Set-Content -Encoding utf8 reduce.py
          python reduce.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-sqlite-reduction
          path: sqlite-reduction.json
          if-no-files-found: warn
