name: V3 historical cancellation load diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0f172f9fe692ff8fafcc0a15a72fe51eaf67e977
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[all]'
      - name: Trace historical cancellation under CPU contention
        shell: pwsh
        run: |
          @'
          import faulthandler, runpy, sys
          faulthandler.dump_traceback_later(4, repeat=True)
          sys.argv = ['unittest', 'tests.test_delegation.DelegationTests.test_cancel_during_provider_call_prevents_late_write', '-v']
          runpy.run_module('unittest', run_name='__main__')
          '@ | Set-Content -Encoding utf8 trace_cancel.py
          'while True: pass' | Set-Content -Encoding utf8 hog.py
          New-Item -ItemType Directory -Force logs | Out-Null
          $hogs = @()
          try {
            $hogs += Start-Process python -ArgumentList 'hog.py' -PassThru -NoNewWindow
            $hogs += Start-Process python -ArgumentList 'hog.py' -PassThru -NoNewWindow
            for ($i=1; $i -le 50; $i++) {
              python trace_cancel.py *> "logs/cancel-$i.log"
              Write-Host "iteration $i exit=$LASTEXITCODE"
            }
          } finally {
            foreach ($hog in $hogs) { Stop-Process -Id $hog.Id -Force -ErrorAction SilentlyContinue }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-cancellation-cpu-load
          path: logs/
          if-no-files-found: warn
