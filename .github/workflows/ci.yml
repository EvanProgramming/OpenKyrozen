name: V3 benchmark test-file isolation diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protect:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: python -m pip install -e '.[all]'
      - name: Test attack resistance and production preflight
        run: |
          python -m unittest tests.test_v3_protected_worker -v
          python -c 'from benchmarks.v3_matched_live import _verify_worker_protection; _verify_worker_protection()'
