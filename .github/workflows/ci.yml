name: V3 Windows snapshot diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: caa7f444c5d5be43bb53f40625879c3fe19bf167
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[all]'
      - name: Compare unmodified fixture with database excluded from history
        shell: pwsh
        run: |
          @'
          import os, runpy, shutil, sys
          from pathlib import Path
          from openkyrozen.workspace.history import HistoryManager
          original_excluded = HistoryManager._excluded
          original_copy = shutil.copy2
          def tracked_copy(source, destination, *args, **kwargs):
              if Path(source).name in {'state.sqlite3', 'state.sqlite3-wal', 'state.sqlite3-shm'}:
                  print('SNAPSHOT_DATABASE_FILE:', Path(source).name, flush=True)
              return original_copy(source, destination, *args, **kwargs)
          shutil.copy2 = tracked_copy
          if os.environ.get('EXCLUDE_DB') == '1':
              def excluded(self, path):
                  db = Path(self.store.path).expanduser().resolve()
                  return path in {db, Path(str(db)+'-wal'), Path(str(db)+'-shm'), Path(str(db)+'-journal')} or original_excluded(self, path)
              HistoryManager._excluded = excluded
          sys.argv = ['scripts/subagent_workflow_acceptance.py']
          runpy.run_path(sys.argv[0], run_name='__main__')
          '@ | Set-Content -Encoding utf8 snapshot_compare.py
          New-Item -ItemType Directory -Force comparison | Out-Null
          foreach ($mode in @('baseline','excluded')) {
            $env:EXCLUDE_DB = if ($mode -eq 'excluded') {'1'} else {'0'}
            for ($i=1; $i -le 25; $i++) {
              $log = "comparison/$mode-$i.log"
              python snapshot_compare.py *> $log
              Write-Host "$mode iteration $i exit=$LASTEXITCODE"
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-snapshot-comparison
          path: comparison/
          if-no-files-found: warn
