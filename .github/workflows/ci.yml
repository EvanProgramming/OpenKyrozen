name: OpenKyrozen CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y zsh
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install fastapi uvicorn

    - name: Install package and run unit tests
      run: |
        pip install -e '.[browser]'
        python -m playwright install --with-deps chromium
        python -m unittest discover -s tests -p 'test_*.py' -v

    - name: Syntax check
      run: |
        python -c "compile(open('main.py').read(), 'main.py', 'exec'); print('main.py OK')"
        python -c "compile(open('tools.py').read(), 'tools.py', 'exec'); print('tools.py OK')"
        python -c "compile(open('memory.py').read(), 'memory.py', 'exec'); print('memory.py OK')"
        python -c "compile(open('providers.py').read(), 'providers.py', 'exec'); print('providers.py OK')"
        python -c "compile(open('server.py').read(), 'server.py', 'exec'); print('server.py OK')"
        python -c "compile(open('workspace_context.py').read(), 'workspace_context.py', 'exec'); print('workspace_context.py OK')"
        sh -n install.sh

    - name: Tool inventory check
      run: |
        python -c "from tools import AVAILABLE_TOOLS; assert len(AVAILABLE_TOOLS) >= 24, f'Expected >=24 tools, got {len(AVAILABLE_TOOLS)}'; print(f'{len(AVAILABLE_TOOLS)} tools OK')"

    - name: Provider import check
      run: |
        python -c "from providers import *; print('All providers imported OK')"

    - name: Documentation and runtime inventory check
      run: make docs-check

  wheel-install:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Build and run clean wheel installation smoke test
      run: |
        python -m pip install --upgrade pip build
        python scripts/wheel_smoke.py

  installer-syntax:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Parse PowerShell installer and run help path
      shell: pwsh
      run: ./install.ps1 -Help

  docker-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Build and replace-container persistence smoke test
      run: make docker-smoke
