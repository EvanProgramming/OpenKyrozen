name: OpenKyrozen CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tui-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go 1.27.1
      uses: actions/setup-go@v5
      with:
        go-version: "1.27.1"

    - name: Test the Bubble Tea terminal UI
      run: go test ./...
      working-directory: tui

  core-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Provision the non-browser development path and run lightweight tests
      run: |
        make install-core PYTHON=python
        make test-core

  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install full development dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y zsh
        python -m pip install --upgrade pip
        pip install -e '.[all]'

    - name: Install Chromium and run the full test suite
      run: |
        python -m playwright install --with-deps chromium
        make test PYTHON=python

    - name: Agent workflow acceptance
      run: make agent-acceptance

    - name: Syntax check
      run: |
        python -m compileall -q openkyrozen main.py server.py tui_backend.py learning_worker.py scripts tests benchmarks
        sh -n install.sh

    - name: Tool inventory check
      run: |
        python -c "from openkyrozen.tools import ToolAdapters; AVAILABLE_TOOLS = ToolAdapters().AVAILABLE_TOOLS; assert len(AVAILABLE_TOOLS) >= 24, f'Expected >=24 tools, got {len(AVAILABLE_TOOLS)}'; print(f'{len(AVAILABLE_TOOLS)} tools OK')"

    - name: Provider import check
      run: |
        python -c "from openkyrozen.providers import *; print('All providers imported OK')"

    - name: Documentation and runtime inventory check
      run: make docs-check

  wheel-install:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Set up Go 1.27.1
      uses: actions/setup-go@v5
      with:
        go-version: "1.27.1"

    - name: Build and run clean wheel installation smoke test
      run: |
        python -m pip install --upgrade pip build
        python scripts/wheel_smoke.py
        pip install -e '.[all]'

    - name: Rebuilt TUI interaction acceptance
      run: make tui-acceptance

  installer-syntax:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Parse PowerShell installer and run help path
      shell: pwsh
      run: ./install.ps1 -Help

  docker-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Build and replace-container persistence smoke test
      run: make docker-smoke

  update-install:
    name: Installed update (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: actions/setup-go@v5
      with:
        go-version: "1.27.1"
    - name: Install uv
      run: python -m pip install uv
    - name: Upgrade a real prior installation and verify matching components
      env:
        AUDIT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      run: >-
        python scripts/update_workflow_acceptance.py
        --revision ${{ env.AUDIT_REVISION }}
        --baseline git+https://github.com/EvanProgramming/OpenKyrozen.git@94a1d99eab337719308cbf998b0515f454c1acc6
        --output update-acceptance.json
    - name: Upload update acceptance evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: update-acceptance-${{ matrix.os }}
        path: update-acceptance.json
