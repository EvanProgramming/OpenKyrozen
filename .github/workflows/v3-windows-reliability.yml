# Preparation only: Root and independent review before commit/push/dispatch.
name: Isolated macOS soak diagnosis
on: workflow_dispatch
permissions:
  contents: read
jobs:
  original-20s:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: diagnostic
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Diagnose one unchanged signed product
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/mac-soak-private-home"
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1
          mkdir -m 700 "$HOME"
          git clone --no-checkout --no-hardlinks https://github.com/EvanProgramming/OpenKyrozen.git "$RUNNER_TEMP/mac-soak-product"
          git -C "$RUNNER_TEMP/mac-soak-product" checkout --detach 6ebc93f19e87fc29fb8ee88df9d9948bfaea5d5a
          python -I -B "$GITHUB_WORKSPACE/diagnostic/scripts/v3_macos_soak_diagnostic.py" \
            --source "$RUNNER_TEMP/mac-soak-product" --output "$RUNNER_TEMP/mac-soak-evidence" \
            --public-key "$GITHUB_WORKSPACE/diagnostic/scripts/signer-public.gpg"
      - name: Retain all diagnostic outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-macos31210-20s-6ebc93f
          path: ${{ runner.temp }}/mac-soak-evidence/
          if-no-files-found: warn
