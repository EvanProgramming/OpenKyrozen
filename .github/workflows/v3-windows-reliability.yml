name: V3 Windows cancellation investigation
on:
  push:
    branches: ['Evan/v3-windows-cancellation-investigation-20261107']
    paths: ['.github/workflows/v3-windows-reliability.yml', 'scripts/v3_windows_reliability.py', 'tests/test_v3_windows_reliability.py']
  workflow_dispatch:
    inputs:
      history_copyfile2_probe:
        description: Fixed historical/current CopyFile2 counterfactuals only; no capture or release acceptance
        type: boolean
        default: false
      decode_existing_etl:
        description: Decode only the frozen existing 42521583044 ETL; no product or WPR execution
        type: boolean
        default: false
      candidate_sha:
        description: Exact 40-character product commit to test (diagnostic code remains separate)
        type: string
        required: true
        default: '7905fb634fe447243668c2d01179ce5cb2cdb275'
      control:
        description: Load control; native-vfs is one fixed six-cell WAL/control-file campaign
        type: choice
        options: [baseline, cpu, sqlite, combined, paired-anchor, native-wait, native-vfs, all]
        default: baseline
      iterations:
        description: Samples per control and Python version (1–50)
        type: number
        default: 50
      environment:
        description: Current packages, or exact original Python 3.12.10/packages with reviewer interleaving
        type: choice
        options: [current, historical]
        default: current
env:
  PRODUCT_SHA: ${{ inputs.candidate_sha || '7905fb634fe447243668c2d01179ce5cb2cdb275' }}
  ITERATIONS: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.iterations) || '50' }}
  HISTORICAL_ENVIRONMENT: ${{ inputs.environment == 'historical' && '1' || '0' }}
permissions:
  contents: read
jobs:
  cancellation:
    if: ${{ !inputs.decode_existing_etl && !inputs.history_copyfile2_probe }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.environment == 'historical' && '["3.12.10"]' || '["3.12","3.13"]') }}
        control: ${{ fromJSON(inputs.control == 'all' && '["baseline","cpu","sqlite","combined"]' || format('["{0}"]', inputs.control || 'baseline')) }}
    env:
      LOAD_CONTROL: ${{ matrix.control }}
    steps:
      - name: Validate exact candidate identity
        shell: pwsh
        run: |
          if ($env:PRODUCT_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'candidate_sha must be a full lowercase commit SHA' }
          if ($env:ITERATIONS -cnotmatch '^[0-9]+$' -or [int]$env:ITERATIONS -lt 1 -or [int]$env:ITERATIONS -gt 50) { throw 'iterations must be 1–50' }
          if ($env:HISTORICAL_ENVIRONMENT -eq '1' -and [int]$env:ITERATIONS -gt 20) { throw 'historical campaign is bounded at 20 iterations' }
          if ($env:LOAD_CONTROL -eq 'paired-anchor' -and [int]$env:ITERATIONS -gt 10) { throw 'paired-anchor is bounded at 10 pairs' }
          if ($env:LOAD_CONTROL -eq 'native-wait' -and ($env:HISTORICAL_ENVIRONMENT -ne '1' -or [int]$env:ITERATIONS -ne 4)) { throw 'native-wait requires historical environment and exactly four triples' }
          if ($env:LOAD_CONTROL -eq 'native-vfs' -and ($env:HISTORICAL_ENVIRONMENT -ne '1' -or [int]$env:ITERATIONS -ne 1)) { throw 'native-vfs requires historical environment and one fixed six-cell campaign' }
      - name: Checkout diagnostic harness
        uses: actions/checkout@v4
        with:
          path: diagnostic-source
          fetch-depth: 0
      - name: Checkout exact product
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          path: product
          fetch-depth: 0
      - name: Checkout original product for native wait comparison
        if: matrix.control == 'native-wait' || matrix.control == 'native-vfs'
        uses: actions/checkout@v4
        with:
          ref: '0f172f9fe692ff8fafcc0a15a72fe51eaf67e977'
          path: historical-product
          fetch-depth: 0
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ matrix.python }}
      - name: Retain unavailable historical runtime evidence
        if: failure() && steps.python.outcome == 'failure'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows-evidence | Out-Null
          '{"status":"INFRASTRUCTURE_FAILURE","reason":"Requested Python runtime could not be provisioned"}' | Set-Content -Encoding utf8 windows-evidence/historical-environment.json
      - name: Verify checked-out product
        shell: pwsh
        working-directory: product
        run: |
          if ((git rev-parse HEAD) -cne $env:PRODUCT_SHA) { throw 'Checked-out candidate differs from requested commit' }
          if (git status --porcelain --untracked-files=no) { throw 'Product checkout has tracked edits' }
      - name: Install exact product dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows-evidence | Out-Null
          if ($env:HISTORICAL_ENVIRONMENT -eq '1') {
            python diagnostic-source/scripts/v3_windows_reliability.py --write-historical-requirements windows-evidence/historical-requirements.txt
            if ($LASTEXITCODE -ne 0) { throw 'Unable to prepare historical requirements' }
            python -m pip install -r windows-evidence/historical-requirements.txt -e './product[all]' *> windows-evidence/dependency-install.log
            if ($LASTEXITCODE -ne 0) {
              '{"status":"INFRASTRUCTURE_FAILURE","reason":"Original pinned dependencies could not be installed; no substitutions allowed"}' | Set-Content -Encoding utf8 windows-evidence/historical-environment.json
              throw 'Historical dependency installation failed; inspect dependency-install.log'
            }
          } else {
            python -m pip install -e './product[all]'
            if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          }
      - name: Record dependency versions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows-evidence | Out-Null
          python -m pip freeze | Set-Content -Encoding utf8 windows-evidence/dependencies.txt
          $env:GITHUB_SHA | Set-Content -Encoding utf8 windows-evidence/diagnostic-commit.txt
      - name: Trace unchanged cancellation test under recorded load control
        shell: pwsh
        run: |
          $historical = @()
          if ($env:HISTORICAL_ENVIRONMENT -eq '1') { $historical = @('--historical-environment', '--interleave-reviewer') }
          $native = @()
          if ($env:LOAD_CONTROL -in @('native-wait', 'native-vfs')) { $native = @('--historical-repository', 'historical-product') }
          python diagnostic-source/scripts/v3_windows_reliability.py --repository product --output windows-evidence --iterations $env:ITERATIONS --control $env:LOAD_CONTROL --cpu-workers 2 @historical @native
      - name: Verify diagnostic harness independently of historical product
        if: always() && steps.python.outcome == 'success'
        working-directory: diagnostic-source
        shell: python
        run: |
          import json, os, sys, tempfile
          from pathlib import Path
          root = Path.cwd().resolve()
          sys.path.insert(0, str(root))
          from scripts.v3_windows_reliability import isolated_environment, run_process
          output = root.parent / 'windows-evidence'
          output.mkdir(exist_ok=True)
          code = ("from pathlib import Path; import openkyrozen, unittest; "
                  "print('Diagnostic product source:', openkyrozen.__file__, flush=True); "
                  "assert Path(openkyrozen.__file__).resolve().is_relative_to(Path.cwd()); "
                  "unittest.main(module='tests.test_v3_windows_reliability', verbosity=2)")
          with tempfile.TemporaryDirectory(prefix='kyrozen-diagnostic-tests-') as home:
              env = isolated_environment(Path(home))
              env['PYTHONPATH'] = str(root)
              env['KYROZEN_DIAGNOSTIC_TEST_OUTPUT'] = str(output / 'diagnostic-test-evidence')
              result = run_process([sys.executable, '-c', code], output / 'diagnostic-unittest.log', env, timeout=300)
          returncode = result['returncode']
          (output / 'diagnostic-unittest.json').write_text(json.dumps({
              'status': 'INFRASTRUCTURE_FAILURE' if returncode == 124 else 'PASS' if returncode == 0 else 'FAIL',
              **result, 'diagnostic_commit': os.environ['GITHUB_SHA'],
              'python': sys.version, 'scope': 'diagnostic-source only; separate from historical product acceptance',
              }, indent=2), encoding='utf-8')
          raise SystemExit(returncode)
      - name: Upload investigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cancellation-${{ matrix.python }}-${{ env.PRODUCT_SHA }}-${{ matrix.control }}
          path: windows-evidence/
          if-no-files-found: error

  offline-decode:
    if: github.event_name == 'workflow_dispatch' && inputs.decode_existing_etl && !inputs.history_copyfile2_probe
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout diagnostic harness only
        uses: actions/checkout@v4
        with:
          path: diagnostic-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Download only the frozen original artifact ZIP
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            fs.mkdirSync('offline-input');
            const request = {owner: context.repo.owner, repo: context.repo.repo};
            const source = {repository: 'EvanProgramming/OpenKyrozen', run_id: 42521583044,
              artifact_id: 13634081142, head_sha: '085141807a5aee1231c8b467663848671beaad37'};
            fs.writeFileSync('offline-input/download-receipt.json', JSON.stringify({status:'STARTED',source}));
            try {
              if (request.owner + '/' + request.repo !== source.repository) throw new Error('repository mismatch');
              const {data: run} = await github.rest.actions.getWorkflowRun({...request, run_id:source.run_id});
              const {data: artifact} = await github.rest.actions.getArtifact({...request, artifact_id:source.artifact_id});
              const metadata = {repository:source.repository, run_id:run.id, head_sha:run.head_sha,
                run_status:run.status, artifact:{id:artifact.id, name:artifact.name,
                  size_in_bytes:artifact.size_in_bytes, digest:artifact.digest, expired:artifact.expired,
                  workflow_run:artifact.workflow_run}};
              fs.writeFileSync('offline-input/source-metadata.json', JSON.stringify(metadata,null,2));
              if (run.id !== source.run_id || run.head_sha !== source.head_sha || run.status !== 'completed' ||
                  artifact.id !== source.artifact_id || artifact.workflow_run?.id !== source.run_id ||
                  artifact.workflow_run?.head_sha !== source.head_sha || artifact.expired ||
                  artifact.size_in_bytes !== 49821978 ||
                  artifact.digest !== 'sha256:658a74f4c8c20883d5f91e2165c5b1f01e86d0cfd64c515d344256355e93393a') {
                throw new Error('source metadata mismatch');
              }
              const download = await github.rest.actions.downloadArtifact({...request,
                artifact_id:source.artifact_id, archive_format:'zip', request:{timeout:30000}});
              const bytes = Buffer.from(download.data);
              if (bytes.length !== 49821978) throw new Error('archive size mismatch');
              fs.writeFileSync('offline-input/source.zip',bytes,{flag:'wx'});
              fs.writeFileSync('offline-input/download-receipt.json',JSON.stringify({status:'DOWNLOADED',source,bytes:bytes.length}));
            } catch (error) {
              fs.writeFileSync('offline-input/download-receipt.json',JSON.stringify({status:'BLOCKED',source,
                error_type:error.name,http_status:error.status || null}));
              throw new Error('Frozen artifact download blocked; inspect retained receipt/metadata');
            }
      - name: Test only the offline decode boundaries
        working-directory: diagnostic-source
        shell: pwsh
        run: |
          python -c "import unittest; unittest.main(module='tests.test_v3_windows_reliability', defaultTest='OfflineNativeDecodeTests', verbosity=2)" *> ../offline-input/offline-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Offline decoder boundary tests failed' }
      - name: Decode existing ETL once without starting capture or product workloads
        shell: pwsh
        run: |
          python diagnostic-source/scripts/v3_windows_reliability.py --offline-decode-archive offline-input/source.zip --offline-source-metadata offline-input/source-metadata.json --output offline-decode-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Offline decode BLOCKED; inspect retained output' }
      - name: Preserve separate offline decode evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-offline-decode-${{ github.run_id }}-${{ github.sha }}
          path: |
            offline-decode-evidence/
            offline-input/source-metadata.json
            offline-input/download-receipt.json
            offline-input/offline-tests.log
          if-no-files-found: error

  history-copyfile2-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.history_copyfile2_probe
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Validate fixed forensic probe identity
        shell: pwsh
        env:
          DECODE_MODE: ${{ inputs.decode_existing_etl }}
        run: |
          if ($env:DECODE_MODE -eq 'true') { throw 'Probe and existing-ETL decoder modes are mutually exclusive' }
          if ($env:PRODUCT_SHA -cne '8c595f909859b0fda10ff4fdb6e25f4ccb25c96e') { throw 'Probe requires the frozen 8c candidate' }
          if ($env:HISTORICAL_ENVIRONMENT -cne '1' -or $env:ITERATIONS -cne '1') { throw 'Probe requires historical packages and one fixed counterfactual set' }
      - name: Checkout diagnostic code
        uses: actions/checkout@v4
        with:
          path: diagnostic-source
          fetch-depth: 0
      - name: Checkout exact current source
        uses: actions/checkout@v4
        with:
          ref: '8c595f909859b0fda10ff4fdb6e25f4ccb25c96e'
          path: product
          fetch-depth: 0
      - name: Checkout exact historical source
        uses: actions/checkout@v4
        with:
          ref: '0f172f9fe692ff8fafcc0a15a72fe51eaf67e977'
          path: historical-product
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Verify exact checked-out probe sources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force history-copyfile2-evidence | Out-Null
          $sources = @(
            @{ path = 'diagnostic-source'; expected = $env:GITHUB_SHA },
            @{ path = 'product'; expected = '8c595f909859b0fda10ff4fdb6e25f4ccb25c96e' },
            @{ path = 'historical-product'; expected = '0f172f9fe692ff8fafcc0a15a72fe51eaf67e977' }
          )
          $records = @($sources | ForEach-Object {
            $observed = git -C $_.path rev-parse HEAD
            $headExit = $LASTEXITCODE
            $changes = git -C $_.path status --porcelain --untracked-files=no
            $statusExit = $LASTEXITCODE
            $dirty = $null
            if ($statusExit -eq 0) { $dirty = [bool]$changes }
            @{ path = $_.path; expected = $_.expected; observed = $observed; head_exitcode = $headExit; status_exitcode = $statusExit; tracked_edits = $dirty }
          })
          $records | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 history-copyfile2-evidence/source-identities.json
          foreach ($record in $records) {
            if ($record.head_exitcode -ne 0 -or $record.status_exitcode -ne 0 -or $record.observed -cne $record.expected -or $record.tracked_edits) { throw 'Probe source identity command or tracked bytes differ' }
          }
      - name: Install pinned historical dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force history-copyfile2-evidence | Out-Null
          python diagnostic-source/scripts/v3_windows_reliability.py --write-historical-requirements history-copyfile2-evidence/historical-requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Unable to prepare historical requirements' }
          python -m pip install -r history-copyfile2-evidence/historical-requirements.txt -e './product[all]' *> history-copyfile2-evidence/dependency-install.log
          if ($LASTEXITCODE -ne 0) { throw 'Pinned dependency installation failed; no substitutions allowed' }
          python -m pip freeze | Set-Content -Encoding utf8 history-copyfile2-evidence/dependencies.txt
          $env:GITHUB_SHA | Set-Content -Encoding utf8 history-copyfile2-evidence/diagnostic-commit.txt
      - name: Run bounded private forensic probe and its boundary tests
        working-directory: diagnostic-source
        shell: python
        run: |
          import json, os, sys, tempfile
          from pathlib import Path
          root = Path.cwd().resolve()
          sys.path.insert(0, str(root))
          from scripts.v3_windows_reliability import isolated_environment, run_process
          output = root.parent / 'history-copyfile2-evidence'
          helper = root / 'scripts/diagnostics/history_copyfile2/probe.py'
          receipt_path = output / 'process-receipt.json'
          receipt = {'diagnostic_commit': os.environ['GITHUB_SHA'],
              'scope': 'CAUSAL_CLASS_ONLY; original capture and R260 remain BLOCKED',
              'product_or_WPR_campaign_executed': False, 'returncode': None,
              'cleanup_uncertified': True, 'step_failed': True}
          phase = 'setup'
          try:
              with tempfile.TemporaryDirectory(prefix='kyrozen-copyfile2-probe-') as home:
                  env = isolated_environment(Path(home))
                  env['KYROZEN_DISABLE_VECTOR_INDEX'] = '1'
                  env['COPYFILE2_CURRENT_SOURCE'] = str(root.parent / 'product')
                  phase = 'boundary_tests'
                  unit = run_process([sys.executable, '-I', '-m', 'unittest', 'discover', '-s', str(helper.parent), '-p', 'test_*.py', '-v'], output / 'boundary-tests.log', env, timeout=45)
                  (output / 'boundary-tests.json').write_text(json.dumps(unit, indent=2), encoding='utf-8')
                  if unit['returncode']:
                      raise SystemExit(unit['returncode'])
                  phase = 'probe'
                  result = run_process([sys.executable, '-I', str(helper),
                      '--old-source', str(root.parent / 'historical-product'),
                      '--current-source', str(root.parent / 'product'),
                      '--output', str(output / 'probe')], output / 'probe-process.log', env, timeout=45)
                  receipt.update(result)
                  cleanup = result.get('timeout_cleanup')
                  certified = isinstance(cleanup, dict) and cleanup.get('descendant_cleanup_certified') is True
                  code = result.get('returncode')
                  receipt['cleanup_uncertified'] = type(code) is not int or (cleanup is not None and not certified) or (code == 124 and not certified)
                  receipt['step_failed'] = type(code) is not int or code != 0 or receipt['cleanup_uncertified']
                  phase = 'private_home_cleanup'
                  receipt_path.write_text(json.dumps(receipt, indent=2), encoding='utf-8')
          except BaseException as error:
              receipt.update(step_failed=True, failure_phase=phase,
                  step_error={'type': type(error).__name__, 'winerror': getattr(error, 'winerror', None), 'errno': getattr(error, 'errno', None)})
              if phase == 'private_home_cleanup':
                  receipt['cleanup_uncertified'] = True
              receipt_path.write_text(json.dumps(receipt, indent=2), encoding='utf-8')
              raise
          receipt['private_home_cleanup_completed'] = True
          receipt_path.write_text(json.dumps(receipt, indent=2), encoding='utf-8')
          raise SystemExit(code if type(code) is int and code != 0 else (1 if receipt['step_failed'] else 0))
      - name: Preserve every probe outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-history-copyfile2-${{ env.PRODUCT_SHA }}-${{ github.run_id }}
          path: history-copyfile2-evidence/
          if-no-files-found: error

  diagnostic-regression:
    if: github.event_name == 'workflow_dispatch' && inputs.decode_existing_etl && !inputs.history_copyfile2_probe
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout diagnostic harness only
        uses: actions/checkout@v4
        with:
          path: diagnostic-source
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12.10'
      - name: Install unchanged historical pins and diagnostic package only
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diagnostic-regression-evidence | Out-Null
          $head = (git -C diagnostic-source rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA) { throw 'Diagnostic checkout identity mismatch' }
          @{diagnostic_commit=$head; declared_product_sha=$env:PRODUCT_SHA; product_checked_out=$false} | ConvertTo-Json | Set-Content -Encoding utf8 diagnostic-regression-evidence/source-identity.json
          python diagnostic-source/scripts/v3_windows_reliability.py --write-historical-requirements diagnostic-regression-evidence/historical-requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Historical requirements preparation failed' }
          python -m pip install -r diagnostic-regression-evidence/historical-requirements.txt -e './diagnostic-source[all]' *> diagnostic-regression-evidence/dependency-install.log
          $installed = $LASTEXITCODE
          python -m pip freeze | Set-Content -Encoding utf8 diagnostic-regression-evidence/dependencies.txt
          if ($installed -ne 0) { throw 'Pinned diagnostic dependencies failed; no substitutions allowed' }
      - name: Run the complete diagnostic unittest module in a private home
        if: always() && steps.python.outcome == 'success'
        working-directory: diagnostic-source
        shell: python
        run: |
          import json, os, sys, tempfile
          from pathlib import Path
          root = Path.cwd().resolve()
          sys.path.insert(0, str(root))
          from scripts.v3_windows_reliability import historical_environment, isolated_environment, run_process
          output = root.parent / 'diagnostic-regression-evidence'
          output.mkdir(exist_ok=True)
          receipt = {'status': 'INFRASTRUCTURE_FAILURE', 'cleanup_uncertified': True,
              'diagnostic_commit': os.environ['GITHUB_SHA'], 'declared_product_sha': os.environ['PRODUCT_SHA'],
              'python': sys.version, 'scope': 'diagnostic-source unit tests only; no product/native acceptance'}
          code = 1
          try:
              historical = historical_environment()
              (output / 'historical-environment.json').write_text(json.dumps(historical, indent=2), encoding='utf-8')
              if historical['status'] != 'MATCH':
                  raise RuntimeError('Original pinned runtime/dependencies unavailable')
              command = ("import json; from pathlib import Path; import openkyrozen, unittest; "
                  "source = Path(openkyrozen.__file__).resolve(); "
                  "print('Diagnostic product source:', source, flush=True); "
                  "assert source.is_relative_to(Path.cwd()); "
                  "Path(" + repr(str(output / 'import-source.json')) + ").write_text("
                  "json.dumps({'module':'openkyrozen','path':str(source),'cwd':str(Path.cwd())}), encoding='utf-8'); "
                  "unittest.main(module='tests.test_v3_windows_reliability', verbosity=2)")
              with tempfile.TemporaryDirectory(prefix='kyrozen-diagnostic-tests-') as home:
                  env = isolated_environment(Path(home))
                  env['PYTHONPATH'] = str(root)
                  env['KYROZEN_DIAGNOSTIC_TEST_OUTPUT'] = str(output / 'diagnostic-test-evidence')
                  result = run_process([sys.executable, '-c', command], output / 'diagnostic-unittest.log', env, timeout=300)
                  receipt.update(result)
                  code = result.get('returncode')
                  cleanup = result.get('timeout_cleanup')
                  certified = isinstance(cleanup, dict) and cleanup.get('descendant_cleanup_certified') is True
                  receipt['cleanup_uncertified'] = type(code) is not int or (cleanup is not None and not certified) or (code == 124 and not certified)
                  (output / 'diagnostic-unittest.json').write_text(json.dumps(receipt, indent=2), encoding='utf-8')
              receipt['private_home_cleanup_completed'] = True
              receipt['status'] = 'PASS' if type(code) is int and code == 0 and not receipt['cleanup_uncertified'] else 'INFRASTRUCTURE_FAILURE' if code == 124 else 'FAIL'
          except BaseException as error:
              receipt.update(status='INFRASTRUCTURE_FAILURE', cleanup_uncertified=True, error_class=type(error).__name__)
          finally:
              (output / 'diagnostic-unittest.json').write_text(json.dumps(receipt, indent=2), encoding='utf-8')
          raise SystemExit(code if type(code) is int and code != 0 else (0 if receipt['status'] == 'PASS' else 1))
      - name: Preserve diagnostic-only regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-diagnostic-regression-${{ github.run_id }}-${{ github.sha }}
          path: diagnostic-regression-evidence/
          if-no-files-found: error
