name: V3 benchmark isolation diagnostics
on:
  push:
    branches: ['Evan/v3-finalization']
    paths: ['benchmarks/**', 'tests/test_v3_protected_worker.py', '.github/workflows/v3-benchmark-isolation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux backend without changing host security policy
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap
          sysctl kernel.apparmor_restrict_unprivileged_userns user.max_user_namespaces > isolation-policy-before.txt
      - name: Install project dependencies
        run: python -m pip install -e '.[all]'
      - name: Record diagnostic identity
        shell: bash
        run: |
          git rev-parse HEAD > isolation-commit.txt
          python -m pip freeze > isolation-dependencies.txt
      - name: Verify actor isolation and cleanup without persistent accounts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          interpreter="$(command -v python)"
          private_home="$RUNNER_TEMP/openkyrozen-uid-owner-home"
          sudo -n mkdir -p "$private_home"
          sudo -n chmod 700 "$private_home"
          sudo -n env -i PATH="$PATH" HOME="$private_home" TMPDIR=/var/tmp PYTHONPATH="$PWD" \
            PYTHONDONTWRITEBYTECODE=1 KYROZEN_DISABLE_VECTOR_INDEX=1 \
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$PWD" \
            "$interpreter" -m unittest tests.test_v3_process_owner tests.test_v3_linux_namespace \
            tests.test_v3_actor_supervisor tests.test_v3_actor_worker tests.test_v3_actor_dispatch \
            tests.test_v3_actor_native_acceptance \
            tests.test_v3_shell_cleanup tests.test_v3_protected_worker -v 2>&1 | tee isolation-tests.log
      - name: Verify host security policy was preserved
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns user.max_user_namespaces > isolation-policy-after.txt
          diff -u isolation-policy-before.txt isolation-policy-after.txt
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolation-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            isolation-commit.txt
            isolation-dependencies.txt
            isolation-tests.log
            isolation-policy-before.txt
            isolation-policy-after.txt
