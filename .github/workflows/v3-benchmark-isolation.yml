name: V3 benchmark isolation diagnostics
on:
  push:
    branches: ['Evan/v3-finalization']
    paths: ['benchmarks/**', 'tests/test_v3_protected_worker.py', '.github/workflows/v3-benchmark-isolation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux backend using the existing CI configuration
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install project dependencies
        run: python -m pip install -e '.[all]'
      - name: Record diagnostic identity
        shell: bash
        run: |
          git rev-parse HEAD > isolation-commit.txt
          python -m pip freeze > isolation-dependencies.txt
      - name: Exercise bounded protection and required full-preflight refusal
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_v3_protected_worker -v 2>&1 | tee isolation-tests.log
      - name: Verify privileged UID ownership without persistent accounts
        shell: bash
        run: |
          set -euo pipefail
          interpreter="$(command -v python)"
          private_home="$RUNNER_TEMP/openkyrozen-uid-owner-home"
          sudo -n mkdir -p "$private_home"
          sudo -n chmod 700 "$private_home"
          sudo -n env -i PATH="$PATH" HOME="$private_home" PYTHONPATH="$PWD" \
            PYTHONDONTWRITEBYTECODE=1 "$interpreter" \
            -m unittest tests.test_v3_process_owner -v 2>&1 | tee uid-ownership-tests.log
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolation-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            isolation-commit.txt
            isolation-dependencies.txt
            isolation-tests.log
            uid-ownership-tests.log
