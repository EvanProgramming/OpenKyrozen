name: V3 Mac routing timeout diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  routing-timeout:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify signed diagnostic and unchanged frozen product
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base=4f6bf9c9dd4d4c4f5526d70994e133b55d8a8992
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$base" "$GITHUB_SHA"
          test "$(git rev-parse "$base:openkyrozen")" = "$(git rev-parse "$GITHUB_SHA:openkyrozen")"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" > routing-diagnostic-github-commit.json
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          base='4f6bf9c9dd4d4c4f5526d70994e133b55d8a8992'
          sha=os.environ['GITHUB_SHA']
          commit=json.loads(Path('routing-diagnostic-github-commit.json').read_text())
          verification=commit['commit']['verification']
          if commit['sha']!=sha or verification['verified'] is not True or verification['reason']!='valid':
              raise SystemExit('diagnostic commit must have a valid verified signature')
          allowed={'tests/test_v3_routing_supplement.py','benchmarks/v3_actor_worker.py',
                   '.github/workflows/v3-benchmark-isolation.yml'}
          changed=set(subprocess.check_output(['git','diff','--name-only',base,sha],text=True).splitlines())
          if not changed or not changed<=allowed:
              raise SystemExit('diagnostic delta exceeds the three authorized apparatus files')
          tree=lambda ref:subprocess.check_output(['git','rev-parse',ref+':openkyrozen'],text=True).strip()
          Path('routing-diagnostic-identity.json').write_text(json.dumps({
              'schema_version':1,'diagnostic_sha':sha,'origin_sha':base,'changed_paths':sorted(changed),
              'product_tree':tree(sha),'origin_product_tree':tree(base),
              'signature_verified':verification['verified'],'signature_reason':verification['reason'],
              'signature_verified_at':verification.get('verified_at')},indent=2)+'\n')
          PY
          git show --no-patch --format=raw HEAD > routing-diagnostic-commit.txt
      - name: Install project dependencies
        run: python -m pip install -e '.[all]'
      - name: Record platform and dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip freeze > routing-diagnostic-dependencies.txt
          {
            python -VV
            uname -a
            sw_vers
            command -v sandbox-exec
            sudo -n id
          } > routing-diagnostic-platform.txt
      - name: Run the original three variants with bounded phase and stack capture
        shell: bash
        run: |
          set -euo pipefail
          interpreter="$(command -v python)"
          umask 022
          stage_root="$(mktemp -d /var/tmp/openkyrozen-routing-diagnostic.XXXXXX)"
          trap 'sudo -n rm -rf -- "$stage_root"' EXIT
          chmod 755 "$stage_root"
          git clone --no-checkout --no-hardlinks "$PWD" "$stage_root/source"
          git -C "$stage_root/source" checkout --detach "$GITHUB_SHA"
          test "$(git -C "$stage_root/source" rev-parse HEAD)" = "$GITHUB_SHA"
          sudo -n chown -R 0:0 "$stage_root"
          private_home="$stage_root/parent-home"
          sudo -n mkdir -p "$private_home"
          sudo -n chmod 700 "$private_home"
          cd "$stage_root/source"
          sudo -n env -i PATH="$PATH" HOME="$private_home" TMPDIR=/var/tmp PYTHONPATH="$PWD" \
            PYTHONDONTWRITEBYTECODE=1 KYROZEN_DISABLE_VECTOR_INDEX=1 \
            "$interpreter" -m unittest \
            tests.test_v3_routing_supplement.PrivilegedRoutingSupplementTests.test_parent_bound_root_and_child_routing_variants_use_original_native_runtime \
            -v 2>&1 | tee "$GITHUB_WORKSPACE/routing-diagnostic-tests.log"
      - name: Preserve original diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routing-timeout-macos-py313
          path: |
            routing-diagnostic-identity.json
            routing-diagnostic-github-commit.json
            routing-diagnostic-commit.txt
            routing-diagnostic-dependencies.txt
            routing-diagnostic-platform.txt
            routing-diagnostic-tests.log
